spring.application.name=erp-todotcom

# Chaves RSA usadas para assinar/validar os JWTs
jwt.public_key.pem=${JWT_PUBLIC_KEY:classpath:public_key_pkcs8.pem}
jwt.private_key.pem=${JWT_PRIVATE_KEY:file:./keys/private_key_pkcs8.pem}

# E.G.:
#jwt.public_key.pem=classpath:public_key_pkcs8.pem
#jwt.private_key.pem=classpath:private_key_pkcs8.pem

# Banco de dados (MySQL). Credenciais via variaveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/erp_todotcom?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.main.allow-bean-definition-overriding=true
spring.jpa.dafer-datasource-initialization=always

server.error.include-exception=false
server.error.include-stacktrace=never
